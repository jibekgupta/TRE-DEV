name: Deploy DEV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Hello World to development
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://jibekgupta.github.io/TRE-DEV/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site
          cp hello-world/index.html hello-world/styles.css _site/
          sed -i \
            -e 's/__ENV__/DEV/g' \
            -e 's/__ENV_SLUG__/dev/g' \
            -e 's/__REPO__/TRE-DEV/g' \
            -e 's/__CICD__/GitHub Actions on push to main/g' \
            _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
